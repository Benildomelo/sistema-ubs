<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Meu Perfil - Sistema UBS</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#005EA2",
                        "ubs-blue": "#2A75A5",
                        "ubs-green": "#00A859"
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 font-sans">
    <!-- Header -->
    <header class="bg-white dark:bg-gray-800 p-4 border-b border-gray-200 dark:border-gray-700">
        <div class="flex items-center gap-3">
            <button onclick="history.back()" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">
                <span class="material-symbols-outlined text-gray-600 dark:text-gray-300">arrow_back</span>
            </button>
            <h1 class="text-xl font-bold text-gray-900 dark:text-white">Meu Perfil</h1>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="p-4 max-w-md mx-auto">
        <!-- Avatar e Nome -->
        <div class="text-center mb-8">
            <div class="flex justify-center mb-4">
                <div id="userAvatar" class="size-20 rounded-full flex items-center justify-center text-white text-2xl font-bold">
                    <!-- Avatar será gerado pelo JavaScript -->
                </div>
            </div>
            <h2 id="userName" class="text-xl font-bold text-gray-900 dark:text-white mb-1">Carregando...</h2>
            <p id="userEmail" class="text-gray-600 dark:text-gray-300">carregando...</p>
        </div>

        <!-- Informações Pessoais -->
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm p-6 mb-6">
            <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-4">Informações Pessoais</h3>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Nome Completo</label>
                    <p id="profileName" class="text-gray-900 dark:text-white">Carregando...</p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">E-mail</label>
                    <p id="profileEmail" class="text-gray-900 dark:text-white">carregando...</p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">CPF</label>
                    <p id="profileCPF" class="text-gray-900 dark:text-white">carregando...</p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Telefone</label>
                    <p id="profilePhone" class="text-gray-900 dark:text-white">carregando...</p>
                </div>
            </div>
        </div>

        <!-- Estatísticas -->
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm p-6 mb-6">
            <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-4">Minhas Consultas</h3>

            <div class="grid grid-cols-2 gap-4">
                <div class="text-center p-3 bg-blue-50 dark:bg-blue-900/20 rounded-lg">
                    <p class="text-2xl font-bold text-blue-600" id="totalAppointments">0</p>
                    <p class="text-sm text-blue-600">Total</p>
                </div>
                <div class="text-center p-3 bg-green-50 dark:bg-green-900/20 rounded-lg">
                    <p class="text-2xl font-bold text-green-600" id="completedAppointments">0</p>
                    <p class="text-sm text-green-600">Realizadas</p>
                </div>
            </div>
        </div>

        <!-- Ações -->
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm p-6">
            <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-4">Ações</h3>

            <div class="space-y-2">
                <button onclick="editProfile()" class="w-full flex items-center gap-3 p-3 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
                    <span class="material-symbols-outlined text-gray-600 dark:text-gray-300">edit</span>
                    <span class="text-gray-700 dark:text-gray-300">Editar Perfil</span>
                </button>

                <button onclick="changePassword()" class="w-full flex items-center gap-3 p-3 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
                    <span class="material-symbols-outlined text-gray-600 dark:text-gray-300">lock</span>
                    <span class="text-gray-700 dark:text-gray-300">Alterar Senha</span>
                </button>

                <button onclick="logout()" class="w-full flex items-center gap-3 p-3 rounded-lg hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors text-red-600">
                    <span class="material-symbols-outlined">logout</span>
                    <span>Sair da Conta</span>
                </button>
            </div>
        </div>
    </main>

    <script src="js/perfil.js"></script>
</body>
</html>
