<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Unidades de Saúde - Sistema UBS</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#005EA2",
                        "ubs-blue": "#2A75A5",
                        "ubs-green": "#00A859"
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 font-sans">
    <!-- Header -->
    <header class="bg-white dark:bg-gray-800 p-4 border-b border-gray-200 dark:border-gray-700">
        <div class="flex items-center gap-3">
            <button class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">
                <span class="material-symbols-outlined text-gray-600 dark:text-gray-300">arrow_back</span>
            </button>
            <h1 class="text-xl font-bold text-gray-900 dark:text-white">Unidades de Saúde</h1>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="p-4">
        <!-- Busca Simplificada -->
        <div class="mb-6">
            <div class="relative">
                <span class="material-symbols-outlined absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400">search</span>
                <input type="text" id="searchInput" placeholder="Buscar por nome, endereço ou especialidade..."
                    class="w-full pl-10 pr-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-white placeholder-gray-500 focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>
        </div>

        <!-- Lista de Unidades -->
        <div id="unitsList" class="space-y-4">
            <!-- Unidades serão carregadas pelo JavaScript -->
        </div>
    </main>

    <script src="js/unidades.js"></script>
</body>
</html>
